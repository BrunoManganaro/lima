<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./santos3.webp" type="image/webp">
    <link rel="stylesheet" href="estilo.css">
    <title>Cadastro</title>
</head>
<body>
    <h1>Formulário de Cadastro</h1>
    <form action="https://webhook.site/a1487f94-959a-44a0-bfb0-904eae37c3aa"
     method="POST">
        <label for="nome">Nome:</label>
        <input 
            type="text" 
            id="nome" 
            name="nome" 
            required 
            min-length="2"
            max-length="151"
            placeholder="Digite seu nome"
        >
        <br><br>
        <label for="email">E-mail:</label>
        <input 
            type="email" 
            id="email" 
            name="email" 
            required 
            placeholder="exemplo@email.com"
        >
        <br><br>
        <label for="telefone">Telefone:</label>
        <input 
            type="tel" 
            id="telefone" 
            name="telefone" 
            required 
            placeholder="(XX) XXXXX-XXXX"
            pattern="\(\d{2}\) \d{4,5}-\d{4}"
        >
        <br><br>
        <label for="idade">Idade:</label>
        <input 
            type="number" 
            id="idade" 
            name="idade" 
            required 
            min="18"
            max="126"
            step="1"
        >
        <br><br>
        <label for="data-nascimento">Data de nascimento:</label>
        <input 
            type="date" 
            id="data-nascimento" 
            name="data-nascimento" 
            required 
            min="1900-01-01"
            max="2026-07-24"
        >
        <br><br>
        <label for="website">Página Pessoal:</label>
        <input 
            type="url" 
            id="website" 
            name="website" 
            placeholder="https://www.seusite.com"
        >
        <br><br>
        <label for="comentários">Comentários:</label>
        <textarea
            id="comentários" 
            name="comentários" 
            rows="4"
            cols="50"
            maxlength="500"
            placeholder="Deixe seu comentário aqui"
        ></textarea>
        <br><br>

        <button tye="submit">Cadastrar</button>

        <br>

        <img src="./rony.webp" id="rony">
        <img src="./sócio rei.webp" id="socioRei">

        <br>
        <h3>TORNE-SE SÓCIO REI</h3>
    </form>
    <p>&copy; 2026 - Todos os direitos reservados</p>
</body>
</html>
