<!DOCTYPE html> <!-- <exemplo> é chamado de tag -->
<html lang="pt-br">
<head> <!-- tag de abertura -->
    <link rel="stylesheet" href="./style.css">
    <meta charset="UTF-8">   
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" 
    content="Um guia completo sobre HTML e suas tags.">
    <meta name="keywords" content="HTML, tags, programação, web design">
    <meta name="author" content="Bruno Manganaro">

    <link rel="icon" href="./r10.webp" type="image/webp">
    <link rel="stylesheet" 
    href="https://fonts.googleapis.com/css2?family=Griffy&display=swap">
    <link rel="stylesheet" 
    href="https://fonts.googleapis.com/css2?family=Sixtyfour&display=swap">
    <link rel="stylesheet" 
    href="https://fonts.googleapis.com/css2?family=Creepster&display=swap">
    <link rel="stylesheet" 
    href="https://fonts.googleapis.com/css2?family=Cherish&display=swap" >

    <script defer src="./script.js"></script> 
    <!-- defer serve para atrasar um comando-->

    <title>Lyamal</title>
</head> <!-- tag de fechamento -->
<body>
    <header>
        <h1 style="font-family: Griffy">Bem-vindo ao site!</h1>
    </header>

    <main>
        <p style="font-family: Sixtyfour">
            Este é um exemplo de uma página definido com o português do Brasil</p>
        <p style="font-family: Sixtyfour" id="paragrafo">
            Bora</p>
        <p style="font-family: Creepster" id="demo">1</p>

        <button style="font-family: Cherish" type="button" 
        onclick="document.getElementById('demo').innerText=
        document.getElementById('demo').innerText+1">Botão</button>

        <button style="font-family: Cherish" type="button" id="botao">
            67
        </button>

        <img src="https://th.bing.com/th/id/OIP.fSqdvFokgnZU6S6Qu2g6RwHaH3?w=154&h=180&c=7&r=0&o=7&dpr=1.5&pid=1.7&rm=3">
    </main>

    <footer>
        &copy; 2026 - Todos os direitos reservados
    </footer>
</body>
</html>
